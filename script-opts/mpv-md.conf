# mpv-md 配置（放到 mpv 的 script-opts 目录）
# Windows: %APPDATA%\mpv\script-opts\mpv-md.conf
# Linux/macOS: ~/.config/mpv/script-opts/mpv-md.conf

# 目标笔记软件（当前仅支持 obsidian）
backend=obsidian

# curl 可执行文件（一般保持默认）
curl=curl

# --- Obsidian Local REST API ---
# API Key 在 Obsidian → 设置 → Local REST API 中查看
obsidian_host=127.0.0.1
obsidian_port=27123
obsidian_use_https=yes
obsidian_api_key=在这里填写你的API Key
obsidian_verify_tls=no

# --- 笔记位置（vault 内路径，以 / 开头，不带结尾斜杠） ---
# 注意：asset_dir 建议放在 note_dir 内，这样笔记里可用相对路径引用截图
note_dir=/视频笔记
asset_dir=/视频笔记/assets

# --- 行为 ---
# 时间戳格式：hms（超过 1 小时显示 h:mm:ss，否则 mm:ss）
timestamp_format=hms
# 截图模式：video=不含字幕  subtitles=含字幕  window=含OSD和字幕
screenshot_mode=subtitles
# 触发快捷键（mpv 键位语法）
key_binding=Ctrl+Alt+n
# 笔记标题最大长度
max_title_len=80
